<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ミヌクル サポート</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      line-height: 1.8;
      color: #1f2f4d;
      background: #fffaf2;
      padding: 24px;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 18px;
      padding: 36px 28px;
      box-shadow: 0 8px 28px rgba(24, 52, 92, 0.08);
    }
    h1 {
      font-size: 28px;
      color: #18345c;
      margin-bottom: 8px;
    }
    .lead {
      color: #5b6f92;
      margin-bottom: 28px;
      font-size: 16px;
    }
    .links {
      display: grid;
      gap: 14px;
    }
    a.card {
      display: block;
      padding: 18px 20px;
      background: #fff7ee;
      border: 1px solid #f3dfc7;
      border-radius: 14px;
      color: #18345c;
      text-decoration: none;
    }
    a.card:hover {
      background: #fff2e3;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .desc {
      font-size: 14px;
      color: #5b6f92;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ミヌクル</h1>
    <p class="lead">App Store 提出用のサポートページです。</p>

    <div class="links">
      <a class="card" href="support.html">
        <div class="title">サポート</div>
        <div class="desc">よくある質問と問い合わせ先</div>
      </a>
      <a class="card" href="privacy-policy.html">
        <div class="title">プライバシーポリシー</div>
        <div class="desc">データの取り扱いと広告 SDK について</div>
      </a>
    </div>
  </div>
</body>
</html>
