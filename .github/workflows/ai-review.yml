name: AI Review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  review:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    uses: pershey/ai-review-workflows/.github/workflows/reusable-ai-review.yml@4ad1fbb11d5c7c6d96a0b8e6da4c0a652644c410
    with:
      source_run_id: ${{ github.event.workflow_run.id }}
      source_run_attempt: ${{ github.event.workflow_run.run_attempt }}
      source_head_sha: ${{ github.event.workflow_run.head_sha }}
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      project_profile: generic
      review_model: gpt-5.6-sol
      prompt_cache_mode: disabled
      max_reviews_per_campaign: 3
      max_api_attempts_per_campaign: 3
      max_estimated_input_tokens_per_review: 150000
      max_campaign_input_tokens: 350000
      max_campaign_estimated_cost_usd: 2.0
      auto_codex_handoff: false
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
