name: AI Review Human Resume

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing PR number for the stopped campaign
        required: true
        type: number
      reason:
        description: Human-reviewed reason for resuming
        required: true
        type: string
      additional_reviews:
        description: Additional API reviews authorized
        required: true
        type: number
      additional_input_tokens:
        description: Additional campaign input tokens authorized
        required: true
        type: number
      additional_cost_usd:
        description: Additional estimated USD authorized
        required: true
        type: number

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  resume:
    uses: pershey/ai-review-workflows/.github/workflows/reusable-human-resume.yml@4ad1fbb11d5c7c6d96a0b8e6da4c0a652644c410
    with:
      pr_number: ${{ fromJSON(inputs.pr_number) }}
      reason: ${{ inputs.reason }}
      additional_reviews: ${{ fromJSON(inputs.additional_reviews) }}
      additional_input_tokens: ${{ fromJSON(inputs.additional_input_tokens) }}
      additional_cost_usd: ${{ fromJSON(inputs.additional_cost_usd) }}
