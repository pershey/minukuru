name: Minukuru
options:
  deploymentTarget:
    iOS: 17.0
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.naoyaochiai.minukuru
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 9
    MARKETING_VERSION: 1.0
    DEVELOPMENT_TEAM: NRJLLKV544
    CODE_SIGN_STYLE: Automatic
targets:
  Minukuru:
    type: application
    platform: iOS
    sources:
      - path: MinukuruApp
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: ミヌクル
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: MinukuruApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
    dependencies:
      - package: GoogleMobileAds
    scheme:
      testTargets:
        - MinukuruTests
  MinukuruTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MinukuruTests
    dependencies:
      - target: Minukuru
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
